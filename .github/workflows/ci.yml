name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  demo:
    name: 编译校验 + 跑演示
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall -q scripts examples

      - name: 跑演示（不需要领星账号）
        run: python examples/run_demo.py

      - name: 检查演示是否真的产生了差异项
        run: |
          test -f examples/output/差异明细.csv
          grep -q "AMZ-1002" examples/output/差异明细.csv
          grep -q "AMZ-9999" examples/output/差异明细.csv
          echo "✅ 差异识别逻辑正常"
